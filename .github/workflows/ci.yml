name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build backend TypeScript
        run: npm run build
        working-directory: backend

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend

      - name: Verify bundle secret exclusion
        run: |
          if [ ! -f ../.env ]; then
            echo "GOOGLE_API_KEY=test-canary-secret-key-do-not-leak" > ../.env
          fi
          npm run check:bundle-secret
        working-directory: frontend

      - name: Build Docker image (CI validation)
        run: docker build -t document-chaser:ci-test .
